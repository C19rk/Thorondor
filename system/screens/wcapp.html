<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argus — App</title>
    <link rel="stylesheet" type="text/css" href="/static/styles/wcapp.css" />
  </head>
  <body>
    <div class="container">
      <!-- ── Video Panel (Left) ────────────────────────────────────────── -->
      <div class="video">
        <h2 class="header-title">
          ARGUS {% if is_admin %}
          <span class="badge">ADMIN</span>
          {% endif %}

          <span id="status" style="display: none"
            >&nbsp;&nbsp;VIDEO RECORDING IN PROGRESS</span
          >
        </h2>
        <div class="divider-app-type"></div>

        <p class="app-type">Webcam Detection</p>

        <!-- Controls -->
        <div class="overlay">
          <button id="startB" class="btn rec-btn" onclick="doRec('start')">
            RECORD VIDEO
          </button>

          <button id="stopB" class="btn stop-btn" onclick="doRec('stop')">
            STOP VIDEO
          </button>

          <button
            id="startLogB"
            class="btn log-rec-btn"
            onclick="doLogRec('start')"
          >
            RECORD LOG
          </button>

          <button
            id="stopLogB"
            class="btn log-stop-btn"
            onclick="doLogRec('stop')"
          >
            STOP LOG
          </button>

          {% if is_admin %}
          <a href="/admin" class="btn admin-btn">VIEW DATABASE</a>
          {% endif %}

          <a href="/logout" class="btn logout-btn">LOGOUT</a>
        </div>

        <div class="divider"></div>

        <!-- Progress Bar -->
        <div class="progress-space">
          <div id="saveWarning">
            Finalizing Video Export. Do not close the application!
          </div>

          <div id="progress">
            <div id="progressBar"></div>
            <span id="progressText">0%</span>
          </div>
        </div>

        <!-- Video feed -->
        <img id="videoStream" src="/video_feed" alt="Live Video" />
      </div>

      <!-- ── Log Panel (Right) ─────────────────────────────────────────── -->
      <div class="log">
        <h2>
          Live Detection Log
          <span id="logStatus" style="display: none"
            >&nbsp;&nbsp;RECORDING IN PROGRESS</span
          >
        </h2>
        <div id="log"></div>
      </div>
    </div>

    <script src="/static/scripts/wcapp.js"></script>
  </body>
</html>
