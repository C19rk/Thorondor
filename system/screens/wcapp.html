<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Argus Webcam</title>
    <link rel="stylesheet" type="text/css" href="/static/styles/wcapp.css" />
  </head>
  <body>
    <div class="container">
      <div class="video">
        <h2>
          Live Webcam
          <span id="status">REC</span>
        </h2>
        <div class="overlay">
          <button id="startB" class="btn rec-btn" onclick="doRec('start')">
            RECORD VIDEO
          </button>
          <button id="stopB" class="btn stop-btn" onclick="doRec('stop')">
            STOP VIDEO
          </button>
          <br style="width: 100%" />
          <button
            id="startLogB"
            class="btn log-rec-btn"
            onclick="doLogRec('start')"
          >
            RECORD LOG
          </button>
          <button
            id="stopLogB"
            class="btn log-stop-btn"
            onclick="doLogRec('stop')"
          >
            STOP LOG
          </button>
          {% if is_admin %}
          <a href="/admin" class="btn admin-btn">VIEW DATABASE</a>
          {% endif %}
          <a href="/logout" class="btn logout-btn">LOGOUT</a>
        </div>

        <div id="progress"><div id="progressBar"></div></div>
        <div id="progressText">0%</div>
        <div id="saveWarning">SAVING VIDEO - DO NOT CLOSE APP</div>

        <img
          id="videoStream"
          src="/video_feed"
          style="width: 100%; height: auto; display: block"
        />
      </div>

      <div class="log">
        <h2>
          Live Detection Log
          <span id="logStatus" style="display: none">REC</span>
        </h2>
        <div id="log"></div>
      </div>
    </div>
    <script src="/static/scripts/wcapp.js"></script>
  </body>
</html>
